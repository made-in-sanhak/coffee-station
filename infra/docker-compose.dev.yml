# Isolated local development MySQL; credentials come from the ignored root .env.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-coffee_station}
      MYSQL_USER: ${DB_USER:-coffee}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - devmysql:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h127.0.0.1 -u"$${MYSQL_USER}" -D"$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null 2>&1']
      interval: 2s
      timeout: 3s
      retries: 60
volumes:
  devmysql:
