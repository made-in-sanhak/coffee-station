# 배포용: backend (+ ai-server 사용 시). DB는 AWS RDS(MySQL)를 사용하고 .env 의 DB_HOST 를 RDS 주소로 지정합니다.
services:
  backend:
    build: ../backend
    env_file: ../.env
    environment:
      NODE_ENV: production
    ports:
      - "8080:8080"
    depends_on:
      - ai-server

  ai-server:
    build: ../ai-server
    env_file: ../.env
    expose:
      - "8000"          # 외부에 열지 않고 backend에서만 접근
