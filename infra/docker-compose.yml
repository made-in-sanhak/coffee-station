# 로컬 개발용: MySQL
# 실행 (infra 폴더에서): docker compose --env-file ../.env up -d
# 종료:                  docker compose down        (데이터까지 지우려면 down -v)
services:
  mysql:
    image: mysql:8.4
    container_name: coffee-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-coffee_station}
      MYSQL_USER: ${DB_USER:-coffee}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata:
